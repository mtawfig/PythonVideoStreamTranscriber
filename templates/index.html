<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broadcast (AI) Transcriber</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js" integrity="sha384-c79GN5VsunZvi+Q/WObgk2in0CbZsHnjEqvFxC5DxHn9lTfNce2WW6h2pH6u/kF+" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Logo" class="logo">
                <span class="brand-name">Broadcast (AI) Transcriber</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- YouTube URL Input Form -->
            <div class="form-section">
                <form id="ytForm" class="yt-form">
                    <div class="form-group">
                        <input
                            type="text"
                            id="ytstreamurl"
                            class="form-input"
                            placeholder="Enter YouTube URL (e.g., https://www.youtube.com/watch?v=...)"
                            required
                        >
                        <button type="submit" id="startBtn" class="btn btn-start">Start</button>
                        <button type="button" id="stopBtn" class="btn btn-stop" disabled>Stop</button>
                    </div>
                    <div id="errorMessage" class="error-message"></div>
                </form>
            </div>

            <!-- YouTube Streaming Section (Hidden by default) -->
            <div id="ytstreaming" class="streaming-section" style="display: none;">
                <div class="streaming-container">
                    <!-- Video Column -->
                    <div class="video-column">
                        <div id="ytvideo" class="video-wrapper">
                            <!-- YouTube iframe will be inserted here -->
                        </div>
                    </div>

                    <!-- Transcription Column -->
                    <div class="transcription-column">
                        <div id="yttranscription" class="transcription-content">
                            <!-- Fixed Header with Title and Channel -->
                            <div class="transcription-header">
                                <h2 class="transcription-title" id="transcriptionTitle">Loading...</h2>
                                <div class="transcription-status" id="transcriptionStatus">
                                    <span class="status-indicator"></span>
                                    <span class="status-text">Initializing...</span>
                                </div>
                            </div>

                            <!-- Scrollable Transcription Body -->
                            <div class="transcription-body" id="transcriptionBody">
                                <p class="transcription-text">Transcription will appear here as the video plays...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
