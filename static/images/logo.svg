<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1282a2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#034078ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="25" cy="25" r="24" fill="url(#logoGradient)" stroke="#fefcfbff" stroke-width="1"/>

  <!-- Play button triangle -->
  <polygon points="20,15 20,35 37,25" fill="#fefcfbff"/>

  <!-- Waveform lines (representing transcription) -->
  <line x1="12" y1="25" x2="15" y2="25" stroke="#fefcfbff" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="20" x2="15" y2="23" stroke="#fefcfbff" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="30" x2="15" y2="27" stroke="#fefcfbff" stroke-width="2" stroke-linecap="round"/>
</svg>
